<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dynamic Weather App</title>
    <link rel="stylesheet" href="style.css">
    </head>
    <body>
<div class="weather-card">
        <!-- Search Bar Area -->
        <div class="search">
            <input type="text" id="search-box" spellcheck="false" placeholder="Enter city name...">
            <button id="search-btn">Search</button>
        </div>
<!-- Search bar ke niche aur weather-info ke upar -->
<div class="error" style="display: none; margin-bottom: 20px;">
    <p style="color: #ff4d4d; font-size: 20px; font-weight: 500;">City Not Found. Please try again!</p>
</div>
        <!-- Weather Display Area -->
        <div class="weather-info">
            <h2 id="city">Locating...</h2>
            <img src="" id="weather-icon" style="width: 150px; margin-top: 10px; filter: brightness(1.8) drop-shadow(0px 0px 15px rgba(255, 255, 255, 0.4));">
            <h1 id="temp">fetching </h1>
            <p id="description">fetching</p>
            
            <div class="extra-details">
                <p>Humidity: <span id="humidity">--</span>%</p>
                <p>Wind Speed: <span id="wind">--</span> km/h</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

    </body>
